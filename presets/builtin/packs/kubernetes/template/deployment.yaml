apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{projectName}}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: {{projectName}}
  template:
    metadata:
      labels:
        app: {{projectName}}
    spec:
      containers:
        - name: {{projectName}}
          image: {{projectName}}:latest
          ports:
            - containerPort: 8080
