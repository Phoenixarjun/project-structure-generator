[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "{{pythonPackageName}}"
version = "0.1.0"
description = "Django Apps service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "django>=5.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-django>=4.8.0"
]

[tool.setuptools.packages.find]
where = ["src"]
